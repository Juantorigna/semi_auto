<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src 'self' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self';
                 form-action 'none';
                 base-uri 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
  <title>Area Camper Bergamo — Self-Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=DM+Serif+Display&display=swap">
  <link rel="stylesheet" href="../css/checkout.css?v=1.0">
</head>
<body>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SCREEN 1 — Language Selection              -->
  <!-- ═══════════════════════════════════════════ -->
  <section id="screen-lang" class="screen screen--lang active" role="main" aria-label="Language selection">

    <div class="kiosk-header">
      <div class="kiosk-logo" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="12" width="22" height="12" rx="2" stroke="#52b788" stroke-width="2" fill="none"/>
          <path d="M25 16h5.5a2 2 0 011.8 1.1L34 21v3a1 1 0 01-1 1h-8" stroke="#52b788" stroke-width="2" stroke-linejoin="round" fill="none"/>
          <circle cx="10" cy="26" r="2.5" stroke="#52b788" stroke-width="2" fill="none"/>
          <circle cx="28" cy="26" r="2.5" stroke="#52b788" stroke-width="2" fill="none"/>
          <line x1="12.5" y1="24" x2="25.5" y2="24" stroke="#52b788" stroke-width="2"/>
          <rect x="7" y="15" width="5" height="4" rx="1" stroke="#52b788" stroke-width="1.5" fill="none"/>
          <rect x="15" y="15" width="5" height="4" rx="1" stroke="#52b788" stroke-width="1.5" fill="none"/>
        </svg>
      </div>
      <h1 class="kiosk-title">Self-Checkout</h1>
      <p class="kiosk-subtitle">Select your language · Scegli la lingua</p>
    </div>

    <div class="lang-grid" role="group" aria-label="Available languages">

      <button class="lang-btn" data-lang="it" aria-label="Italiano">
        <div class="lang-flag" aria-hidden="true">
          <svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
            <rect width="27" height="60" fill="#009246"/>
            <rect x="27" width="26" height="60" fill="#fff"/>
            <rect x="53" width="27" height="60" fill="#CE2B37"/>
          </svg>
        </div>
        <span class="lang-label">Italiano</span>
      </button>

      <button class="lang-btn" data-lang="en" aria-label="English">
        <div class="lang-flag" aria-hidden="true">
          <svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
            <rect width="80" height="60" fill="#012169"/>
            <path d="M0 0L80 60M80 0L0 60" stroke="#fff" stroke-width="10"/>
            <path d="M0 0L80 60M80 0L0 60" stroke="#C8102E" stroke-width="6"/>
            <path d="M40 0v60M0 30h80" stroke="#fff" stroke-width="16"/>
            <path d="M40 0v60M0 30h80" stroke="#C8102E" stroke-width="10"/>
          </svg>
        </div>
        <span class="lang-label">English</span>
      </button>

      <button class="lang-btn" data-lang="fr" aria-label="Français">
        <div class="lang-flag" aria-hidden="true">
          <svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
            <rect width="27" height="60" fill="#002395"/>
            <rect x="27" width="26" height="60" fill="#fff"/>
            <rect x="53" width="27" height="60" fill="#ED2939"/>
          </svg>
        </div>
        <span class="lang-label">Français</span>
      </button>

      <button class="lang-btn" data-lang="de" aria-label="Deutsch">
        <div class="lang-flag" aria-hidden="true">
          <svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
            <rect width="80" height="20" fill="#000"/>
            <rect y="20" width="80" height="20" fill="#DD0000"/>
            <rect y="40" width="80" height="20" fill="#FFCE00"/>
          </svg>
        </div>
        <span class="lang-label">Deutsch</span>
      </button>

      <button class="lang-btn" data-lang="es" aria-label="Español">
        <div class="lang-flag" aria-hidden="true">
          <svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
            <rect width="80" height="15" fill="#AA151B"/>
            <rect y="15" width="80" height="30" fill="#F1BF00"/>
            <rect y="45" width="80" height="15" fill="#AA151B"/>
          </svg>
        </div>
        <span class="lang-label">Español</span>
      </button>

    </div>

    <p class="screen-hint" aria-hidden="true">Touch to begin · Tocca per iniziare</p>

  </section>
  <script src="../js/utils.js"></script>
  <script src="../js/checkout.js?v=1.2"></script>
</body>
</html>
