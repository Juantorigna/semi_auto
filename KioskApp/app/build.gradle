plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.campsite.kiosk'
    compileSdk 34

    defaultConfig {
        applicationId "com.campsite.kiosk"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Kiosk: single task, no history
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // read from local.properties
        def props = new Properties()
        file("${rootProject.projectDir}/local.properties").withInputStream { props.load(it) }
        buildConfigField "String", "TML_LOCATION_ID", "\"${props.getProperty('stripe.terminal.location_id', '')}\""
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'

    // Lifecycle (needed for WebView Activity scope)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'

    // Stripe Terminal SDK — WisePOS E (Internet reader)
    implementation("com.stripe:stripeterminal-taptopay:5.4.1")
    implementation("com.stripe:stripeterminal-core:5.4.1")
}